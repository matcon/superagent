[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superagent"
version = "2.3.0"
description = "Autonomous AI Cognitive, SWE Superintelligence & Distributed Execution Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Matias Contreras", email = "matz.contreras@gmail.com" }
]
keywords = [
    "ai", "agent", "superagent", "swe", "sast", "dag", "reflexion",
    "mcp", "orchestration", "ast", "devsecops", "wayland", "niri"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
superagent = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "tools*"]
